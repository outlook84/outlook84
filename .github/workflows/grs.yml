name: Update README cards

on:
  push:
    paths-ignore:
      - "profile/*.svg"
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        repo:
          - yet-another-rclone-dashboard
          - dashbox
          - homer-go
          - journal-scope
          - openlist-tvbox-gateway
          - mpv-handler-openlist
          - mpv-webp-avif-generator
          - cf-hysteria-realm

    steps:
      - uses: actions/checkout@v6

      - name: Generate ${{ matrix.repo }} card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ matrix.repo }}&theme=transparent
          path: ${{ matrix.repo }}.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ${{ matrix.repo }} card
        uses: actions/upload-artifact@v7
        with:
          name: card-${{ matrix.repo }}
          path: ${{ matrix.repo }}.svg
          if-no-files-found: error

  commit:
    runs-on: ubuntu-latest
    needs: generate

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download cards
        uses: actions/download-artifact@v8
        with:
          pattern: card-*
          path: profile
          merge-multiple: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
